<style>
:root{--ink:#1d2140;--brand:#4452b0;--bg:#f2f3fa;--line:#dfe2f2;--ok:#1a8f5a;--okbg:#e0f4ea;--red:#c62828;--redbg:#fde8e8;--mut:#6b7094}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}header img{width:44px;height:44px;border-radius:10px}
header h1{font-size:18px;margin:0;flex:1}header small{display:block;opacity:.8;font-weight:400}header span{font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}input:focus{outline:3px solid #b9c0ee;border-color:var(--brand)}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600}button.g{background:#fff;color:var(--brand);border:1px solid var(--line)}
#login{max-width:340px;margin:60px auto}#login button{width:100%;margin-top:14px}.err{color:var(--red);min-height:20px;margin-top:8px}
.step{border-radius:14px;padding:18px;color:#fff;background:var(--brand);margin-bottom:12px}.step.b{background:#e07b00}.step h2{margin:0 0 4px;font-size:24px}.step p{margin:0;opacity:.9}
#sc{font-size:26px;font-weight:700;padding:16px;text-align:center}
.ok{background:var(--okbg);color:var(--ok);padding:10px;border-radius:8px;margin:10px 0;font-weight:600}.bad{background:var(--redbg);color:var(--red)}
.stats{display:flex;gap:10px;margin-bottom:12px}.st{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}.st b{font-size:28px;display:block}.st.on{box-shadow:0 0 0 2px var(--brand)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1;min-width:150px}
.wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-top:10px}table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);background:#f7f8fd}
.e{min-width:120px;border-radius:20px}.e.p{background:var(--redbg);color:var(--red);border:2px solid var(--red)}.e.r{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
tr.p td:first-child{border-left:5px solid var(--red)}tr.r td:first-child{border-left:5px solid var(--ok)}.x{background:none;color:#b33;padding:4px 8px}
#pr,.hide{display:none}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}#toast.s{opacity:1}
@media print{body{background:#fff}header,main,#login{display:none!important}#pr{display:block;padding:8mm;color:#000}
#pr .h{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--brand);padding-bottom:8px;margin-bottom:10px}#pr img{height:56px}#pr h2{margin:0}
#pr table{font-size:12px}#pr th,#pr td{border:1px solid #888;padding:5px 6px;color:#000;background:#fff}.bx{width:18px;height:18px;border:2px solid #000;display:inline-block}

let me=JSON.parse(sessionStorage.getItem("nx_u")||"null"),D=[],F="PENDIENTE",loc="",timer;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleString("es-BO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("toast");t.textContent=m;t.className="s";setTimeout(()=>t.className="",1800)}
function beep(f){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},130)}catch(e){}}
async function login(){$("le").textContent="";const{data,error}=await sb.from("usuarios").select("usuario,rol,nombre").eq("usuario",$("u").value.trim()).eq("clave",$("p").value).maybeSingle();
 if(error||!data){$("le").textContent=error?"Error de conexión con la base de datos":"Usuario o clave incorrectos";return}
 me=data;sessionStorage.setItem("nx_u",JSON.stringify(me));start()}
function logout(){sessionStorage.removeItem("nx_u");clearInterval(timer);location.reload()}
function start(){if(!me)return;$("login").classList.add("hide");$("out").classList.remove("hide");$("who").textContent=(me.nombre||me.usuario)+" · "+me.rol;
 if(me.rol==="admin"){$("tw").classList.remove("hide");load();timer=setInterval(load,10000)}else{$("op").classList.remove("hide");step(1);mineLoad();$("sc").focus()}}
/* ---- colaborador ---- */
const isLoc=c=>/^LP\d*-/i.test(c);
function step(n){const s=$("stp");s.className="step"+(n==2?" b":"");$("st1").textContent=n==1?"1. Escanee la UBICACIÓN":"2. Escanee el LPN (caja)";
 $("st2").textContent=n==1?"Etiqueta que empieza por LP1-":"Ubicación: "+loc;$("sc").focus()}
function msg(t,bad){$("msg").innerHTML=`<div class="ok ${bad?"bad":""}">${esc(t)}</div>`}
$("sc").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const c=e.target.value;e.target.value="";proc(c)});
let it=null;$("sc").addEventListener("input",e=>{clearTimeout(it);it=setTimeout(()=>{const c=e.target.value.trim();if(c.length>=4){e.target.value="";proc(c)}},200)});
async function proc(c){c=c.trim().toUpperCase();if(!c)return;
 if(isLoc(c)){loc=c;step(2);msg("Ubicación "+c+" lista. Ahora escanee el LPN.");beep(660);return}
 if(!loc){beep(250);msg("Primero escanee una UBICACIÓN (LP1-…)",1);return}
 const{data:dup}=await sb.from("escaneos").select("id,estado").eq("lpn",c).limit(1);
 if(dup&&dup.length){beep(250);msg("LPN "+c+" ya fue registrado ("+dup[0].estado.toLowerCase()+")",1);return}
 const{error}=await sb.from("escaneos").insert({ubicacion:loc,lpn:c,usuario:me.usuario});
 if(error){beep(250);msg("No se guardó: "+error.message,1);return}
 beep(880);msg("✔ Guardado: "+loc+" → "+c);if(!$("keep").checked){loc="";step(1)}else step(2);mineLoad()}
let qr=null,last="",lt=0;
async function cam(){const r=$("rd"),b=$("cam");
 if(qr){try{await qr.stop();qr.clear()}catch(e){}qr=null;r.classList.add("hide");b.textContent="📷 Abrir cámara";return}
 r.classList.remove("hide");b.textContent="✕ Cerrar cámara";const H=Html5QrcodeSupportedFormats;
 qr=new Html5Qrcode("rd",{verbose:false,formatsToSupport:[H.CODE_128,H.CODE_39,H.CODE_93,H.ITF,H.EAN_13,H.EAN_8,H.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
 qr.start({facingMode:"environment"},{fps:10,qrbox:{width:300,height:130}},txt=>{const n=Date.now();if(txt===last&&n-lt<2500){lt=n;return}last=txt;lt=n;proc(txt)},()=>{}).catch(e=>{qr=null;r.classList.add("hide");b.textContent="📷 Abrir cámara";$("cam").style.display="none";msg("Este equipo no tiene cámara disponible. Use el gatillo del lector.",1)})}
async function mineLoad(){const{data}=await sb.from("escaneos").select("*").eq("usuario",me.usuario).order("creado",{ascending:false}).limit(10);
 $("mine").innerHTML=(data||[]).map(x=>`<tr class="${x.estado==="PENDIENTE"?"p":"r"}"><td>${esc(x.ubicacion)}<br><b>${esc(x.lpn)}</b></td><td>${fd(x.creado)}</td></tr>`).join("")}
/* ---- torre de control ---- */
async function load(){const{data,error}=await sb.from("escaneos").select("*").order("creado",{ascending:false}).limit(5000);if(error)return toast("Error: "+error.message);D=data;draw()}
function draw(){const p=D.filter(x=>x.estado==="PENDIENTE").length,q=$("q").value.toLowerCase();
 $("stats").innerHTML=[["","Todos",D.length],["PENDIENTE","Pendientes",p],["PROCESADO","Procesados",D.length-p]].map(a=>`<div class="st ${F===a[0]?"on":""}" onclick="F='${a[0]}';draw()">${a[1]}<b>${a[2]}</b></div>`).join("");
 const L=D.filter(x=>(!F||x.estado===F)&&(!q||(x.ubicacion+x.lpn+x.usuario).toLowerCase().includes(q)));
 $("tb").innerHTML=L.length?L.map(x=>{const pe=x.estado==="PENDIENTE";return`<tr class="${pe?"p":"r"}"><td>${fd(x.creado)}</td><td><b>${esc(x.ubicacion)}</b></td><td>${esc(x.lpn)}</td><td>${esc(x.usuario)}</td>
 <td><button class="e ${pe?"p":"r"}" onclick="tg(${x.id},${pe})">${pe?"PENDIENTE":"✔ PROCESADO"}</button></td><td><button class="x" onclick="del(${x.id})">✕</button></td></tr>`}).join(""):`<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--mut)">Sin registros en este filtro</td></tr>`}
async function tg(id,pe){const{error}=await sb.from("escaneos").update(pe?{estado:"PROCESADO",procesado_por:me.usuario,procesado_en:new Date().toISOString()}:{estado:"PENDIENTE",procesado_por:null,procesado_en:null}).eq("id",id);
 if(error)return toast(error.message);const x=D.find(z=>z.id===id);x.estado=pe?"PROCESADO":"PENDIENTE";draw()}
async function del(id){if(!confirm("¿Eliminar este registro?"))return;await sb.from("escaneos").delete().eq("id",id);D=D.filter(x=>x.id!==id);draw()}
function prt(e){const L=D.filter(x=>!e||x.estado===e).slice().sort((a,b)=>a.ubicacion.localeCompare(b.ubicacion));if(!L.length)return toast("No hay registros");
 $("pr").innerHTML=`<div class="h"><img src="${LOGO}"><div><h2>Verificación de ubicaciones</h2>${e?"Solo pendientes":"Todos"} · ${new Date().toLocaleString("es-BO")} · ${L.length} registros</div></div>
 <table><thead><tr><th>#</th><th>Ubicación</th><th>LPN</th><th>Colaborador</th><th>Verificado</th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.ubicacion)}</b></td><td>${esc(x.lpn)}</td><td>${esc(x.usuario)}</td><td style="text-align:center"><span class="bx">${x.estado==="PROCESADO"?"✔":""}</span></td></tr>`).join("")}</tbody></table>
 <div class="f"><div>Responsable</div><div>Supervisor</div><div>Fecha</div></div>`;setTimeout(()=>print(),100)}

try{navigator.mediaDevices.enumerateDevices().then(d=>{if(!d.some(x=>x.kind==="videoinput"))$("cam").style.display="none"}).catch(()=>{$("cam").style.display="none"})}catch(e){$("cam").style.display="none"}
start();
</script></body></html>
